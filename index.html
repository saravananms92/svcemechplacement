<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ME Placement Dashboard</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Google Charts (optional later) -->
  <script src="https://www.gstatic.com/charts/loader.js"></script>
</head>

<body>

  <h1>SRI VENKATESWARA COLLEGE OF ENGINEERING</h1>
  <h2>DEPARTMENT OF MECHANICAL ENGINEERING</h2>
  <h3>Batch 2022–2026 Placement Dashboard</h3>

  <div class="cards">
    <div class="card" id="total"></div>
    <div class="card" id="opted"></div>
    <div class="card" id="placed"></div>
  </div>

  <h2>Details of the Placed Students</h2>

  <table>
    <thead>
      <tr>
        <th>Programme</th>
        <th>Student Name</th>
        <th>Company</th>
        <th>Company Type</th>
      </tr>
    </thead>
    <tbody id="studentTable">
      <!-- Data will be inserted by script.js -->
    </tbody>
  </table>

  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
