<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MECH Placement Dashboard</title>

  <!-- Google Charts -->
  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #2563eb;
      --success: #16a34a;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.6rem;
    }

    header p {
      margin-top: 6px;
      opacity: 0.9;
      font-size: 0.95rem;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    /* ---- DASHBOARD CARDS ---- */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card h3 {
      margin: 0;
      font-size: 0.95rem;
      color: #475569;
    }

    .card .value {
      margin-top: 8px;
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* ---- CHART CARDS ---- */
    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .chart-card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }

    .chart-card h2 {
      font-size: 1rem;
      margin: 0 0 10px 0;
      color: var(--primary);
      text-align: center;
    }

    .chart {
      width: 100%;
      height: 300px;
    }

    footer {
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
      padding: 20px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 1.3rem;
      }
      .chart {
        height: 260px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Mechanical Engineering Placement Dashboard</h1>
  <p>Live Placement Statistics • Academic Year 2022–2026</p>
</header>

<div class="container">

  <!-- SUMMARY CARDS -->
  <div class="stats">
    <div class="card">
      <h3>Total Students</h3>
      <div class="value" id="totalStudents">—</div>
    </div>

    <div class="card">
      <h3>Students Placed</h3>
      <div class="value" id="placedStudents">—</div>
    </div>

    <div class="card">
      <h3>Placement %</h3>
      <div class="value" id="placementPercent">—</div>
    </div>

    <div class="card">
      <h3>Highest Package</h3>
      <div class="value" id="highestPackage">—</div>
    </div>
  </div>

  <!-- CHART SECTION -->
  <div class="charts">

    <div class="chart-card">
      <h2>Placement Status</h2>
      <div id="placementChart" class="chart"></div>
    </div>

    <div class="chart-card">
      <h2>Programme-wise Placement</h2>
      <div id="programmeChart" class="chart"></div>
    </div>

    <div class="chart-card">
      <h2>Top 10 Packages</h2>
      <div id="topPackageChart" class="chart"></div>
    </div>

  </div>

</div>

<footer>
  © Department of Mechanical Engineering | Placement Cell
</footer>

  // Keep your existing fetch + chart drawing code here
</script>

</body>
</html>
