<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SVCE MECH Placement Overview</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/charts/loader.js"></script>
</head>

<header class="svce-header">
  <img src="Batch2022/assets/logos/college-text-logo.png" class="logo left-logo" alt="college-text-logo">
  
  <div class="header-text">
    <h1>Department of Mechanical Engineering</h1>
    <p>Live Placement Dashboard<br> 
      Circulars | Analytics | Recruiters | Success Statistics | Forms | Contact</p>
  </div>
  
  <img src="Batch2022/assets/logos/college-emblem.png" class="logo right-logo" alt="college-emblem">
</header>
  
<h2>Placement Dashboard</h2>

<style>
.center-box {
  display: flex;
  justify-content: center;
  margin-top: 40px;
}

.select-box {
  width: 260px;
  padding: 12px 15px;
  font-size: 16px;
  border-radius: 8px;
  border: 2px solid #4f46e5;
  background: #fff;
  color: #333;
  cursor: pointer;
  transition: 0.3s;
}

.select-box:hover {
  border-color: #1d4ed8;
}

.select-box:focus {
  outline: none;
  box-shadow: 0 0 6px rgba(79,70,229,0.5);
}
</style>

<div class="center-box">
  <select class="select-box" onchange="location = this.value;">
    <option>Select Batch</option>
    <option value="Batch2022/">Batch 2022-2026</option>
    <option value="Batch2023/">Batch 2023-2027</option>
  </select>
</div>
</html>
